<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- EDIT: This is the title shown on the browser tab -->
  <title>Carlos Kalet Seaborn | Memorable</title>

  <style>
    /* ---------- COLORS (change them here, in one place) ---------- */
    :root {
      --azure: #2a567d;
      --light-azure: #deebf1;
      --gray-azure: #96a4ae;
      --page-bg: #06142a;   /* dark blue page background */
      --card-bg: #0d2440;   /* slightly lighter dark blue for the card */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: var(--page-bg);
      color: var(--light-azure);
      /* One clean font that is already on every device (nothing to download) */
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    /* ---------- THE CARD ---------- */
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--card-bg);
      border: 1px solid var(--azure);
      border-radius: 20px;
      padding: 40px 28px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    /* Spacing between sections */
    .card > * + * { margin-top: 28px; }

    /* ---------- PROFILE PHOTO ---------- */
    .profile-photo {
      width: 140px;
      height: 140px;
      border-radius: 50%;        /* makes it a circle */
      object-fit: cover;         /* crops to fill the circle without stretching */
      border: 3px solid var(--azure);
      display: block;
      margin-left: auto;
      margin-right: auto;
    }

    /* ---------- TEXT ---------- */
    h1 {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 700;          /* bolder heading */
      line-height: 1.2;
      color: #fff;
    }
    .business {
      margin: 8px 0 0;
      font-size: 1.2rem;
      font-weight: 500;
      color: var(--light-azure);
    }
    .tagline {
      margin: 8px 0 0;
      font-size: 0.95rem;
      font-weight: 400;          /* lighter body text */
      color: var(--gray-azure);
    }

    /* ---------- LOGO ---------- */
    .logo {
      width: 100%;
      max-width: 240px;          /* modest size */
      height: auto;              /* keeps the proportions, no stretching */
      display: block;
      margin-left: auto;
      margin-right: auto;
      border-radius: 12px;
    }

    /* ---------- CONTACT BUTTONS ---------- */
    .contact { display: grid; gap: 12px; }
    .contact a {
      display: block;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--azure);
      color: var(--light-azure);
      text-decoration: none;
      font-weight: 500;
      overflow-wrap: anywhere;   /* stops long emails from overflowing */
    }
    .contact a:hover,
    .contact a:focus-visible {
      background: var(--light-azure);
      color: var(--azure);
      outline: none;
    }

    /* ---------- SAVE MY INFO (QR code + Save Contact button) ---------- */
    .save-info h2 {
      margin: 0 0 16px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .qr-box {
      display: inline-block;
      background: var(--light-azure);   /* light backing so the QR code scans well */
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--azure);
    }
    .qr-box img {
      display: block;
      width: 160px;
      height: 160px;
    }
    .qr-caption {
      margin: 10px 0 0;
      font-size: 0.85rem;
      color: var(--gray-azure);
    }
    .save-btn {
      display: block;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: var(--azure);
      color: var(--light-azure);
      text-decoration: none;
      font-weight: 500;
    }
    .save-btn:hover,
    .save-btn:focus-visible {
      background: var(--light-azure);
      color: var(--azure);
      outline: none;
    }
  </style>
</head>

<body>
  <main class="card">

    <!-- 1. PROFILE PHOTO -->
    <!-- EDIT: the photo filename is in src="profile.jpg". If your file is named differently
         (for example my-photo.png), change ONLY the part inside the quotes.
         Line to swap in: <img class="profile-photo" src="YOUR-FILE-NAME.jpg" alt="..."> -->
    <img class="profile-photo" src="images/Selife.jpeg" alt="Portrait of Carlos Kalet Seaborn">

    <!-- 2, 3, 4. NAME, BUSINESS, TAGLINE -->
    <header>
      <!-- EDIT: your name -->
      <h1>Carlos Kalet Seaborn</h1>
      <!-- EDIT: your business name -->
      <p class="business">Memorable</p>
      <!-- EDIT: your tagline -->
      <p class="tagline">Personal messages when they need it most</p>
    </header>

    <!-- 5. LOGO -->
    <!-- EDIT: the logo filename is in src="logo.png". If your file is named differently,
         change ONLY the part inside the quotes.
         Line to swap in: <img class="logo" src="YOUR-LOGO-NAME.png" alt="..."> -->
    <img class="logo" src="images/memorable-logo-icon.png" alt="Memorable logo: a shield with a QR code, a keyhole and an infinity symbol">

    <!-- 6 and 7. PHONE AND EMAIL -->
    <nav class="contact" aria-label="Contact">
      <!-- EDIT: phone. Change the number in href="tel:..." (digits and + only, no spaces)
           AND the text shown between the > < symbols. -->
      <a href="tel:+16292442902">Call +1 (629) 244-2902</a>

      <!-- EDIT: email. Change it in href="mailto:..." AND in the visible text. -->
      <a href="mailto:tonewpathways@gmail.com">tonewpathways@gmail.com</a>
    </nav>

    <!-- SAVE MY INFO: QR code + "Save Contact" button -->
    <!-- EDIT: if your name, business, phone, or email change, you must update them
         in BOTH places below: (1) the long QR code image link, and (2) the
         "Save Contact" button link. They both contain the same contact details
         written in a format called vCard, so they have to match or the saved
         contact will show old info. The easiest way to edit both: open this file
         in a plain text editor, use Find-and-Replace to swap old text for new
         (e.g. replace "Carlos Kalet Seaborn" with your name everywhere),
         then do the same for the business name, phone number, and email. -->
    <section class="save-info">
      <h2>Save My Info</h2>

      <!-- QR CODE: scanning this with a phone camera offers to save the contact
           directly, with no need to visit the page first. It's generated by a
           free public QR service (api.qrserver.com) reading the vCard text below. -->
      <div class="qr-box">
        <img
          src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=BEGIN%3AVCARD%0D%0AVERSION%3A3.0%0D%0AN%3ASeaborn%3BCarlos%3BKalet%3B%3B%0D%0AFN%3ACarlos%20Kalet%20Seaborn%0D%0AORG%3AMemorable%0D%0ATEL%3BTYPE%3DCELL%3A%2B16292442902%0D%0AEMAIL%3Atonewpathways%40gmail.com%0D%0AEND%3AVCARD%0D%0A"
          alt="QR code that saves Carlos Kalet Seaborn's contact details">
      </div>
      <p class="qr-caption">Scan to save my contact</p>

      <!-- SAVE CONTACT BUTTON: tapping this downloads a .vcf file. Phones and
           computers open .vcf files straight into Contacts / Address Book. -->
      <a
        class="save-btn"
        download="Carlos-Kalet-Seaborn.vcf"
        href="data:text/vcard;charset=utf-8,BEGIN%3AVCARD%0D%0AVERSION%3A3.0%0D%0AN%3ASeaborn%3BCarlos%3BKalet%3B%3B%0D%0AFN%3ACarlos%20Kalet%20Seaborn%0D%0AORG%3AMemorable%0D%0ATEL%3BTYPE%3DCELL%3A%2B16292442902%0D%0AEMAIL%3Atonewpathways%40gmail.com%0D%0AEND%3AVCARD%0D%0A">
        Save Contact
      </a>
    </section>

  </main>
</body>
</html>
